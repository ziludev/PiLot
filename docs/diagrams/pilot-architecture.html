<text x="960" y="480" fill="#5C6B85" font-size="8.5" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2">AFTER A KILL -9</text>
<text x="960" y="502" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">The turn does not start over.</text>
<text x="960" y="520" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">The next process reads the last</text>
<text x="960" y="538" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">checkpoint and carries on.</text>
<text x="960" y="596" fill="#5C6B85" font-size="8.5" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2">WHY A GATEWAY</text>
<text x="960" y="618" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">A turn runs for minutes. The</text>
<text x="960" y="636" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">socket has to be free the</text>
<text x="960" y="654" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">moment the next event lands.</text>
<text x="960" y="712" fill="#5C6B85" font-size="8.5" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2">WHY A TOOLBOX</text>
<text x="960" y="734" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">Coding tools live in Go, behind</text>
<text x="960" y="752" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">the names and result shapes the</text>
<text x="960" y="770" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">model already knew.</text>
