<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>One turn · PiLot</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #F7F7F4; }
  body { width: 1240px; height: 984px; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="1240" height="984" viewBox="0 0 1240 984" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#46536B"/>
  </marker>
  <marker id="ar-a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0, 9 3.5, 0 7" fill="#1069EB"/>
  </marker>
</defs>
<rect width="1240" height="984" fill="#F7F7F4"/>
<text x="60" y="48" fill="#5C6B85" font-size="10" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2.6">ONE TURN</text>
<text x="60" y="88" fill="#182235" font-size="33" font-family="Instrument Serif, Georgia, serif" letter-spacing="-0.4">Message in, verdict out — and what a kill -9 costs</text>
<text x="60" y="116" fill="#46536B" font-size="13" font-family="Geist, system-ui, sans-serif">Every step is a durable task: written down before it runs, so a process that was not there at the start can finish the loop.</text>
<rect x="80" y="160" width="380" height="87" rx="39" fill="#FFFFFF" stroke="#5C6B85" stroke-width="1"/>
<text x="96" y="194" fill="#182235" font-size="16" font-family="Geist, system-ui, sans-serif" font-weight="600">Message arrives</text>
<text x="96" y="216" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">Feishu · desktop · CLI</text>
<rect x="80" y="287" width="380" height="130" rx="7" fill="rgba(16,105,235,0.07)" stroke="#1069EB" stroke-width="1.5"/>
<rect x="96" y="301" width="91" height="15" rx="2" fill="none" stroke="#1069EB" stroke-opacity="0.45" stroke-width="0.9"/>
<text x="141" y="312.5" fill="#1069EB" font-size="8" font-family="Geist Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1">DURABLE TASK</text>
<text x="96" y="345" fill="#182235" font-size="16" font-family="Geist, system-ui, sans-serif" font-weight="600">Checkpoint, then run</text>
<text x="96" y="367" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">the row is written before the call</text>
<text x="96" y="386" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">leaves the process</text>
<line x1="270.0" y1="247" x2="270.0" y2="283" stroke="#46536B" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="80" y="457" width="380" height="106" rx="7" fill="#FFFFFF" stroke="#5C6B85" stroke-width="1"/>
<text x="96" y="491" fill="#182235" font-size="16" font-family="Geist, system-ui, sans-serif" font-weight="600">Model request</text>
<text x="96" y="513" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">pi-ai · this conversation's model</text>
<text x="96" y="532" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">and thinking level</text>
<line x1="270.0" y1="417" x2="270.0" y2="453" stroke="#46536B" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="160.0" y="599" width="220" height="58" rx="29" fill="#FFFFFF" stroke="#182235" stroke-width="1.1"/>
<text x="270.0" y="635" fill="#182235" font-size="15" font-family="Geist, system-ui, sans-serif" text-anchor="middle" font-weight="600">tool call?</text>
<line x1="270.0" y1="563" x2="270.0" y2="595" stroke="#46536B" stroke-width="1.3" marker-end="url(#ar)"/>
<path d="M 380.0,628.0 L 596,628.0" fill="none" stroke="#46536B" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="398.0" y="613.0" width="30" height="16" rx="2" fill="#F7F7F4"/>
<text x="413.0" y="625.0" fill="#46536B" font-size="9.5" font-family="Geist Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1">NO</text>
<rect x="596" y="556.0" width="300" height="106" rx="7" fill="#FFFFFF" stroke="#5C6B85" stroke-width="1"/>
<text x="612" y="590.0" fill="#182235" font-size="16" font-family="Geist, system-ui, sans-serif" font-weight="600">Answer</text>
<text x="612" y="612.0" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">the card says how it ended:</text>
<text x="612" y="631.0" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">Done · Goal met · Goal missed</text>
<line x1="270.0" y1="657" x2="270.0" y2="691" stroke="#46536B" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="282.0" y="665" width="34" height="16" rx="2" fill="#F7F7F4"/>
<text x="299.0" y="677" fill="#46536B" font-size="9.5" font-family="Geist Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1">YES</text>
<rect x="80" y="695" width="380" height="130" rx="7" fill="#FFFFFF" stroke="#5C6B85" stroke-width="1"/>
<rect x="96" y="709" width="40" height="15" rx="2" fill="none" stroke="#5C6B85" stroke-opacity="0.45" stroke-width="0.9"/>
<text x="116" y="720.5" fill="#5C6B85" font-size="8" font-family="Geist Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="1">GATE</text>
<text x="96" y="753" fill="#182235" font-size="16" font-family="Geist, system-ui, sans-serif" font-weight="600">Is it dangerous?</text>
<text x="96" y="775" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">rm · force-push · write outside</text>
<text x="96" y="794" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">the workspace</text>
<path d="M 460,760.0 L 596,760.0" fill="none" stroke="#46536B" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#ar)"/>
<rect x="596" y="697.5" width="300" height="125" rx="7" fill="#FFFFFF" stroke="#5C6B85" stroke-width="1"/>
<text x="612" y="731.5" fill="#182235" font-size="16" font-family="Geist, system-ui, sans-serif" font-weight="600">Approval card in your DM</text>
<text x="612" y="753.5" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">only the owner's open_ids can tap</text>
<text x="612" y="772.5" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">nobody taps in 10 min → denied</text>
<text x="612" y="791.5" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">allow-all is kept per risk class</text>
<rect x="478" y="738.0" width="96" height="16" rx="2" fill="#F7F7F4"/>
<text x="526" y="750.0" fill="#46536B" font-size="8.5" font-family="Geist Mono, ui-monospace, monospace" text-anchor="middle" letter-spacing="0.9">IF DANGEROUS</text>
<line x1="270.0" y1="825" x2="270.0" y2="859" stroke="#46536B" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="80" y="863" width="380" height="87" rx="7" fill="#FFFFFF" stroke="#5C6B85" stroke-width="1"/>
<text x="96" y="897" fill="#182235" font-size="16" font-family="Geist, system-ui, sans-serif" font-weight="600">Execute in the toolbox</text>
<text x="96" y="919" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">bash · read · write · edit · delegate</text>
<path d="M 80,936 L 44,936 L 44,510.0 L 80,510.0" fill="none" stroke="#1069EB" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#ar-a)"/>
<text x="950" y="300" fill="#5C6B85" font-size="8.5" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2">WHERE A CRASH LANDS</text>
<text x="950" y="322" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">Kill the process mid-call and</text>
<text x="950" y="340" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">the next one marks that call</text>
<text x="950" y="358" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">interrupted, the model retries it,</text>
<text x="950" y="376" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">and the turn ends where it would</text>
<text x="950" y="394" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">have ended anyway.</text>
<text x="950" y="470" fill="#5C6B85" font-size="8.5" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2">WHY THE WAIT IS DRAWN</text>
<text x="950" y="492" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">Approval is a step, not a modal.</text>
<text x="950" y="510" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">A twelve-second turn can be</text>
<text x="950" y="528" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">twelve seconds of waiting — the</text>
<text x="950" y="546" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">timeline says so instead of</text>
<text x="950" y="564" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">hiding it.</text>
<text x="950" y="720" fill="#5C6B85" font-size="8.5" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2">WHEN IT RUNS AWAY</text>
<text x="950" y="742" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">240 tool calls stops the turn as</text>
<text x="950" y="760" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">Stopped at 240 steps, not as a</text>
<text x="950" y="778" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">failure: the transcript stays and</text>
<text x="950" y="796" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">a Continue picks it up.</text>
</svg>
</body>
</html>
