<text x="60" y="48" fill="#5C6B85" font-size="10" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2.6">ACCESS</text>
<text x="60" y="88" fill="#182235" font-size="33" font-family="Instrument Serif, Georgia, serif" letter-spacing="-0.4">Who can talk, what they reach, what is asked first</text>
<text x="60" y="116" fill="#46536B" font-size="13" font-family="Geist, system-ui, sans-serif">One level per chat, read by validation, the guest policy, the tool surface and every command. The fence is code, not prompt text.</text>
<rect x="60" y="160" width="340" height="286" rx="9" fill="rgba(16,105,235,0.06)" stroke="#1069EB" stroke-width="1.5"/>
<text x="84" y="192" fill="#1069EB" font-size="9" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2.2">OWNER</text>
<text x="84" y="228" fill="#182235" font-size="22" font-family="Geist Mono, ui-monospace, monospace">you</text>
<text x="84" y="252" fill="#46536B" font-size="9.5" font-family="Geist Mono, ui-monospace, monospace">FEISHU_ALLOWED_SENDER_IDS</text>
<text x="84" y="288" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">Talks in any chat that passes</text>
<text x="84" y="307" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">validation. A dangerous call</text>
<text x="84" y="326" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">raises a card in your DM first.</text>
<line x1="84" y1="347" x2="376" y2="347" stroke="rgba(24,34,53,0.12)" stroke-width="0.9"/>
<text x="84" y="371" fill="#182235" font-size="11" font-family="Geist Mono, ui-monospace, monospace">every tool and MCP server</text>
<text x="84" y="389" fill="#182235" font-size="11" font-family="Geist Mono, ui-monospace, monospace">all three memory layers</text>
<rect x="450" y="160" width="340" height="286" rx="9" fill="#FFFFFF" stroke="#5C6B85" stroke-width="1"/>
<text x="474" y="192" fill="#5C6B85" font-size="9" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2.2">GROUP</text>
<text x="474" y="228" fill="#182235" font-size="22" font-family="Geist Mono, ui-monospace, monospace">anyone else</text>
<text x="474" y="252" fill="#46536B" font-size="9.5" font-family="Geist Mono, ui-monospace, monospace">the chat was opened with /allow</text>
<text x="474" y="288" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">Answers only when @-mentioned,</text>
<text x="474" y="307" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">inside a topic — the main</text>
<text x="474" y="326" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">timeline stays clean.</text>
<line x1="474" y1="347" x2="766" y2="347" stroke="rgba(24,34,53,0.12)" stroke-width="0.9"/>
<text x="474" y="371" fill="#182235" font-size="11" font-family="Geist Mono, ui-monospace, monospace">read · skill · recall · remind</text>
<text x="474" y="389" fill="#182235" font-size="11" font-family="Geist Mono, ui-monospace, monospace">project_search · logs_query · db_query</text>
<text x="474" y="407" fill="#182235" font-size="11" font-family="Geist Mono, ui-monospace, monospace">this chat's memory only</text>
<rect x="840" y="160" width="340" height="286" rx="9" fill="rgba(70,83,107,0.045)" stroke="#5C6B85" stroke-width="1" stroke-dasharray="5 4"/>
<text x="864" y="192" fill="#5C6B85" font-size="9" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2.2">CLOSED</text>
<text x="864" y="228" fill="#182235" font-size="22" font-family="Geist Mono, ui-monospace, monospace">nobody</text>
<text x="864" y="252" fill="#46536B" font-size="9.5" font-family="Geist Mono, ui-monospace, monospace">until you authorise the chat</text>
<text x="864" y="288" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">No reply at all. You get one</text>
<text x="864" y="307" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">card with a single button, and</text>
<text x="864" y="326" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">that is the whole surface.</text>
<line x1="864" y1="347" x2="1156" y2="347" stroke="rgba(24,34,53,0.12)" stroke-width="0.9"/>
<text x="864" y="371" fill="#182235" font-size="11" font-family="Geist Mono, ui-monospace, monospace">no tools</text>
<text x="864" y="389" fill="#182235" font-size="11" font-family="Geist Mono, ui-monospace, monospace">no memory</text>

<text x="60" y="520" fill="#5C6B85" font-size="10" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2.6">THE APPROVAL PATH</text>

<text x="76" y="578" fill="#182235" font-size="16" font-family="Geist, system-ui, sans-serif" font-weight="600">A call looks dangerous</text>
<text x="76" y="600" fill="#46536B" font-size="10.5" font-family="Geist Mono, ui-monospace, monospace">rm -rf · force-push · chmod</text>

<text x="346" y="602" fill="#182235" font-size="16" font-family="Geist, system-ui, sans-serif" font-weight="600">Guard asks</text>
<text x="346" y="624" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">beforeTool, in code</text>
<rect x="570" y="544" width="240" height="87" rx="7" fill="#FFFFFF" stroke="#5C6B85" stroke-width="1"/>
<text x="586" y="578" fill="#182235" font-size="16" font-family="Geist, system-ui, sans-serif" font-weight="600">Card in your DM</text>
<text x="586" y="600" fill="#46536B" font-size="11.5" font-family="Geist Mono, ui-monospace, monospace">not in the group</text>

<line x1="530" y1="587.5" x2="566" y2="587.5" stroke="#46536B" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="850" y="544" width="200" height="67" rx="7" fill="rgba(16,105,235,0.07)" stroke="#1069EB" stroke-width="1.5"/>
<text x="866" y="576" fill="#182235" font-size="15" font-family="Geist, system-ui, sans-serif" font-weight="600">allow</text>
<text x="866" y="597" fill="#46536B" font-size="10.5" font-family="Geist Mono, ui-monospace, monospace">runs, and is counted</text>
<rect x="850" y="625" width="200" height="67" rx="7" fill="#FFFFFF" stroke="#5C6B85" stroke-width="1"/>
<text x="866" y="657" fill="#182235" font-size="15" font-family="Geist, system-ui, sans-serif" font-weight="600">deny / 10 min</text>
<text x="866" y="678" fill="#46536B" font-size="10.5" font-family="Geist Mono, ui-monospace, monospace">same callback, same answer</text>

<path d="M 810,587.5 L 830,587.5 L 830,658.5 L 846,658.5" fill="none" stroke="#46536B" stroke-width="1.3" stroke-linejoin="round" marker-end="url(#ar)"/>
<text x="1080" y="540" fill="#5C6B85" font-size="8.5" font-family="Geist Mono, ui-monospace, monospace" letter-spacing="2">EVERY DECISION</text>
<text x="1080" y="562" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">one line in the</text>
<text x="1080" y="580" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">app.audit ring (300),</text>
<text x="1080" y="598" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">read with</text>
<text x="1080" y="616" fill="#46536B" font-size="12" font-family="Geist, system-ui, sans-serif">durable audit</text>
